<title>جوینده کاراکو</title>
<style>
  :root{
    --site-bg:#eef2f5;
    --site-fg:#14212b;
    --site-accent:#0e7a5b;
    --site-on-accent:#ffffff;
    --site-surface:#ffffff;
    --site-muted:#5c6a77;
    --site-border:#d9e1e8;
    --site-font:"Segoe UI",Tahoma,"Iranian Sans",Arial,sans-serif;
    --site-radius:16px;
    --site-space:1;
    --site-type:1;
    --site-motion:1;
    --line:1px solid var(--site-border);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--site-bg);color:var(--site-fg);
    font-family:var(--site-font);font-size:calc(15px * var(--site-type));
    line-height:1.7;min-height:100vh;
    padding-bottom:calc(76px * var(--site-space));
  }
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  .app{max-width:560px;margin:0 auto;padding:0 calc(14px * var(--site-space))}
  header{
    display:flex;align-items:center;gap:calc(10px * var(--site-space));
    padding:calc(14px * var(--site-space)) 0 calc(10px * var(--site-space));
  }
  .mark{
    width:calc(44px * var(--site-space));height:calc(44px * var(--site-space));
    border-radius:calc(12px * var(--site-radius) / 16);
    overflow:hidden;flex:0 0 auto;
    box-shadow:0 2px 6px rgba(20,39,59,.18);
  }
  .mark svg{display:block;width:100%;height:100%}
  .brand{flex:1;min-width:0}
  .brand b{display:block;font-size:calc(17px * var(--site-type));line-height:1.3}
  .brand span{display:block;color:var(--site-muted);font-size:calc(12px * var(--site-type))}
  .chip{
    background:var(--site-surface);border:var(--line);color:var(--site-muted);
    border-radius:calc(999px);padding:calc(4px * var(--site-space)) calc(10px * var(--site-space));
    font-size:calc(11px * var(--site-type));white-space:nowrap;
  }
  .search{position:relative;margin-bottom:calc(12px * var(--site-space))}
  .search input{
    width:100%;background:var(--site-surface);border:var(--line);
    border-radius:calc(var(--site-radius) * 0.8);
    padding:calc(11px * var(--site-space)) calc(12px * var(--site-space));
    outline:none;
  }
  .search input:focus{border-color:var(--site-accent)}
  .filters{display:flex;gap:calc(8px * var(--site-space));overflow:auto;padding-bottom:calc(12px * var(--site-space));scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{
    background:var(--site-surface);border:var(--line);border-radius:calc(999px);
    padding:calc(7px * var(--site-space)) calc(14px * var(--site-space));
    color:var(--site-muted);white-space:nowrap;cursor:pointer;
    transition:background calc(160ms * var(--site-motion)),color calc(160ms * var(--site-motion));
  }
  .filters button.on{background:var(--site-accent);color:var(--site-on-accent);border-color:var(--site-accent)}
  .card{
    background:var(--site-surface);border:var(--line);
    border-radius:var(--site-radius);
    padding:calc(14px * var(--site-space));
    margin-bottom:calc(10px * var(--site-space));
  }
  .card h3{margin:0 0 calc(6px * var(--site-space));font-size:calc(16px * var(--site-type));line-height:1.5}
  .meta{display:flex;flex-wrap:wrap;gap:calc(6px * var(--site-space));margin-bottom:calc(10px * var(--site-space))}
  .meta i{
    font-style:normal;background:var(--site-bg);color:var(--site-muted);
    border-radius:calc(8px);padding:calc(3px * var(--site-space)) calc(8px * var(--site-space));
    font-size:calc(12px * var(--site-type));
  }
  .price{font-weight:700;color:var(--site-accent);margin-bottom:calc(10px * var(--site-space))}
  .price small{font-weight:400;color:var(--site-muted);font-size:calc(12px * var(--site-type))}
  .row-actions{display:flex;flex-wrap:wrap;gap:calc(8px * var(--site-space))}
  .card-actions{display:grid;grid-template-columns:1fr 1fr;gap:calc(8px * var(--site-space))}
  .card-actions button{width:100%}
  button.btn{
    border:1px solid var(--site-accent);background:var(--site-accent);color:var(--site-on-accent);
    border-radius:calc(var(--site-radius) * 0.7);
    padding:calc(9px * var(--site-space)) calc(14px * var(--site-space));
    cursor:pointer;transition:opacity calc(150ms * var(--site-motion));
  }
  button.btn.ghost{background:transparent;color:var(--site-accent)}
  button.btn.soft{background:var(--site-bg);border-color:var(--site-border);color:var(--site-fg)}
  button.btn:active{opacity:.7}
  .status{
    display:inline-flex;align-items:center;gap:calc(6px * var(--site-space));
    font-size:calc(12px * var(--site-type));color:var(--site-muted);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#c0392b}
  .dot.ok{background:#0e7a5b}
  .dot.wait{background:#c98a14}
  .empty{text-align:center;color:var(--site-muted);padding:calc(40px * var(--site-space)) 0}
  .empty b{display:block;color:var(--site-fg);margin-bottom:calc(6px * var(--site-space))}
  form .field{margin-bottom:calc(12px * var(--site-space))}
  form label{display:block;margin-bottom:calc(5px * var(--site-space));color:var(--site-muted);font-size:calc(13px * var(--site-type))}
  form input,form select,form textarea{
    width:100%;background:var(--site-surface);border:var(--line);
    border-radius:calc(var(--site-radius) * 0.75);
    padding:calc(11px * var(--site-space));
    outline:none;
  }
  form textarea{resize:vertical;min-height:calc(70px * var(--site-space))}
  form input:focus,form select:focus,form textarea:focus{border-color:var(--site-accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:calc(10px * var(--site-space))}
  .seg{display:flex;background:var(--site-surface);border:var(--line);border-radius:calc(var(--site-radius) * 0.75);overflow:hidden}
  .seg button{
    flex:1;border:0;background:transparent;padding:calc(11px * var(--site-space));
    color:var(--site-muted);cursor:pointer;
  }
  .seg button.on{background:var(--site-accent);color:var(--site-on-accent)}
  .save{
    width:100%;border:0;background:var(--site-accent);color:var(--site-on-accent);
    padding:calc(14px * var(--site-space));border-radius:var(--site-radius);
    font-weight:700;cursor:pointer;margin-top:calc(6px * var(--site-space));
  }
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;background:var(--site-surface);
    border-top:var(--line);display:flex;z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs button{
    flex:1;border:0;background:transparent;padding:calc(10px * var(--site-space)) 0 calc(9px * var(--site-space));
    color:var(--site-muted);cursor:pointer;font-size:calc(12px * var(--site-type));
  }
  nav.tabs button.on{color:var(--site-accent);font-weight:700}
  nav.tabs .ico{display:block;font-size:calc(19px * var(--site-type));line-height:1.4}
  .sheet-wrap{
    position:fixed;inset:0;background:rgba(16,33,43,.45);display:none;
    z-index:40;align-items:flex-end;justify-content:center;
  }
  .sheet-wrap.on{display:flex}
  .sheet{
    background:var(--site-surface);width:100%;max-width:560px;
    border-radius:var(--site-radius) var(--site-radius) 0 0;
    padding:calc(16px * var(--site-space));
    max-height:86vh;overflow:auto;
    animation:up calc(220ms * var(--site-motion)) ease-out;
  }
  @keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  .sheet h3{margin:0 0 calc(10px * var(--site-space));font-size:calc(15px * var(--site-type))}
  .sheet textarea{
    width:100%;min-height:calc(210px * var(--site-space));border:var(--line);
    border-radius:calc(var(--site-radius) * 0.7);padding:calc(12px * var(--site-space));
    background:var(--site-bg);resize:vertical;line-height:1.9;
  }
  .sheet .row-actions{margin-top:calc(12px * var(--site-space))}
  .toast{
    position:fixed;bottom:calc(92px * var(--site-space));right:50%;transform:translateX(50%);
    background:#14212b;color:#fff;padding:calc(9px * var(--site-space)) calc(16px * var(--site-space));
    border-radius:calc(999px);font-size:calc(13px * var(--site-type));
    opacity:0;pointer-events:none;transition:opacity calc(180ms * var(--site-motion));z-index:60;
  }
  .toast.on{opacity:1}
  .note{
    background:#fff8e6;border:1px solid #f0dcae;color:#6b5320;
    border-radius:var(--site-radius);padding:calc(12px * var(--site-space));
    font-size:calc(13px * var(--site-type));margin-bottom:calc(12px * var(--site-space));
  }
  .photos{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(6px * var(--site-space));margin-bottom:calc(8px * var(--site-space))}
  .photos:empty{display:none}
  .photo{position:relative;aspect-ratio:1/1;border-radius:calc(var(--site-radius) * .5);overflow:hidden;background:var(--site-bg);border:var(--line)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .x{
    position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    border:0;background:rgba(16,33,43,.72);color:#fff;font-size:14px;line-height:20px;
    cursor:pointer;padding:0;
  }
  .strip{display:flex;gap:calc(6px * var(--site-space));margin-bottom:calc(10px * var(--site-space));overflow:auto;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .strip button{
    flex:0 0 auto;width:calc(76px * var(--site-space));height:calc(58px * var(--site-space));
    padding:0;border-radius:calc(var(--site-radius) * .45);overflow:hidden;
    border:var(--line);background:var(--site-bg);cursor:pointer;
  }
  .strip button img{width:100%;height:100%;object-fit:cover;display:block}
  .strip .more{display:flex;align-items:center;justify-content:center;color:var(--site-muted);font-size:calc(12px * var(--site-type));width:calc(64px * var(--site-space))}
  .viewer{text-align:center}
  .viewer img{max-width:100%;max-height:56vh;border-radius:calc(var(--site-radius) * .6);display:block;margin:0 auto calc(10px * var(--site-space))}
  .viewer .nav{display:flex;justify-content:space-between;align-items:center;gap:calc(8px * var(--site-space))}
  .viewer .nav span{color:var(--site-muted);font-size:calc(12px * var(--site-type));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .code{
    font-family:Consolas,"Courier New",monospace;direction:ltr;text-align:center;letter-spacing:2px;
    background:var(--site-bg);border:1px dashed var(--site-border);
    border-radius:calc(var(--site-radius) * .6);padding:calc(10px * var(--site-space));
    font-size:calc(16px * var(--site-type));margin:calc(8px * var(--site-space)) 0;
  }
  .kv{display:flex;justify-content:space-between;gap:calc(8px * var(--site-space));padding:calc(6px * var(--site-space)) 0;border-bottom:1px dashed var(--site-border)}
  .kv:last-child{border-bottom:0}
  .kv span{color:var(--site-muted);font-size:calc(13px * var(--site-type))}
  .kv b{font-weight:600}
  .page{display:none}
  .page.on{display:block}
  .hint{color:var(--site-muted);font-size:calc(12px * var(--site-type));margin-top:calc(6px * var(--site-space))}
  .lock{text-align:center;padding:calc(30px * var(--site-space)) calc(8px * var(--site-space))}
  .lock .big{font-size:calc(38px * var(--site-type));margin-bottom:calc(10px * var(--site-space))}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">
      <svg viewBox="0 0 512 512" role="img" aria-label="KARAKO">
        <defs>
          <linearGradient id="mTile" x1="0" y1="0" x2="0.35" y2="1">
            <stop offset="0%" stop-color="#f3cc7d"/>
            <stop offset="100%" stop-color="#dda63c"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#mTile)"/>
        <g fill="none" stroke="#14273b" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
          <path d="M190 150 V362"/>
          <path d="M190 256 L346 150"/>
          <path d="M190 256 L346 362"/>
        </g>
        <text x="256" y="456" text-anchor="middle" font-family="'Segoe UI Black','Segoe UI',Arial,sans-serif"
              font-size="46" font-weight="800" letter-spacing="9" fill="#14273b">KARAKO</text>
      </svg>
    </div>
    <div class="brand">
      <b>جوینده کاراکو</b>
      <span id="countLine">فایلینگ محمودآباد</span>
    </div>
    <div class="chip">نسخه گوشی</div>
  </header>

  <!-- فایل‌ها -->
  <section class="page on" id="page-list">
    <div class="search">
      <input id="q" type="search" placeholder="جستجو در عنوان، محله، مشخصات">
    </div>
    <div class="filters" id="filters">
      <button class="on" data-f="all">همه</button>
      <button data-f="sale">فروش</button>
      <button data-f="rent">رهن و اجاره</button>
      <button data-f="published">منتشر شده</button>
    </div>
    <div id="list"></div>
    <div class="row-actions" style="margin:14px 0 8px">
      <button class="btn soft" type="button" id="backupBtn">ذخیره پشتیبان</button>
      <button class="btn soft" type="button" id="restoreBtn">بازیابی پشتیبان</button>
      <input type="file" id="restoreInput" accept="application/json,.json" style="display:none">
    </div>
  </section>

  <!-- افزودن -->
  <section class="page" id="page-add">
    <div class="note" id="offlineNote" style="display:none">
      این گوشی اجازه ذخیره‌سازی دائمی به فایل نداد؛ فایل‌ها تا وقتی برنامه باز است می‌مانند.
    </div>
    <form id="fileForm" autocomplete="off">
      <input type="hidden" id="fid">
      <div class="field">
        <label>نوع معامله</label>
        <div class="seg" id="dealSeg">
          <button type="button" data-deal="sale" class="on">فروش</button>
          <button type="button" data-deal="rent">رهن و اجاره</button>
        </div>
      </div>
      <div class="field">
        <label for="title">عنوان فایل</label>
        <input id="title" required placeholder="مثلا آپارتمان ۹۵ متری نوساز">
      </div>
      <div class="field">
        <label for="district">محله</label>
        <input id="district" placeholder="مثلا خیابان امام، محمودآباد">
      </div>
      <div class="grid2">
        <div class="field">
          <label for="area">متراژ</label>
          <input id="area" inputmode="numeric" placeholder="۹۵">
        </div>
        <div class="field">
          <label for="rooms">اتاق</label>
          <input id="rooms" inputmode="numeric" placeholder="۲">
        </div>
      </div>
      <div class="field" id="salePriceBox">
        <label for="price">قیمت فروش</label>
        <input id="price" placeholder="مثلا ۵ میلیارد و ۲۰۰ میلیون">
      </div>
      <div class="grid2" id="rentBox" style="display:none">
        <div class="field">
          <label for="deposit">رهن</label>
          <input id="deposit" placeholder="مثلا ۳۰۰ میلیون">
        </div>
        <div class="field">
          <label for="rent">اجاره</label>
          <input id="rent" placeholder="مثلا ۸ میلیون">
        </div>
      </div>
      <div class="field">
        <label for="details">مشخصات</label>
        <textarea id="details" placeholder="طبقه، سال ساخت، پارکینگ، آسانسور، جهت ساختمان"></textarea>
      </div>
      <div class="field">
        <label>عکس‌های فایل</label>
        <div class="photos" id="photoGrid"></div>
        <div class="row-actions">
          <button class="btn soft" type="button" id="addCam">گرفتن عکس</button>
          <button class="btn soft" type="button" id="addGal">انتخاب از گالری</button>
        </div>
        <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
        <input type="file" id="galInput" accept="image/*" multiple style="display:none">
        <div class="hint">عکس‌ها روی همین گوشی ذخیره می‌شوند و با فایل پشتیبان هم منتقل می‌شوند.</div>
      </div>
      <div class="field">
        <label for="link">لینک آگهی</label>
        <input id="link" inputmode="url" placeholder="اختیاری">
      </div>
      <div class="field">
        <label for="owner">شماره مالک</label>
        <input id="owner" inputmode="tel" placeholder="اختیاری">
      </div>
      <div class="field">
        <label for="consultant">مشاور</label>
        <input id="consultant" placeholder="نام مشاور ثبت‌کننده">
      </div>
      <button class="save" type="submit" id="saveBtn">ثبت فایل</button>
      <button class="btn soft" type="button" id="cancelEdit" style="width:100%;margin-top:10px;display:none">انصراف از ویرایش</button>
      <div class="hint">این نسخه فعلا روی خود گوشی ذخیره می‌کند و به اینترنت نیاز ندارد.</div>
    </form>
  </section>

  <!-- حساب من -->
  <section class="page" id="page-team">
    <div id="accountBox"></div>
  </section>
</div>

<nav class="tabs">
  <button data-tab="list" class="on"><span class="ico">🗂</span>فایل‌ها</button>
  <button data-tab="add"><span class="ico">＋</span>افزودن</button>
  <button data-tab="team"><span class="ico">👤</span>حساب من</button>
</nav>

<div class="sheet-wrap" id="sheet">
  <div class="sheet">
    <h3 id="sheetTitle">متن آگهی</h3>
    <textarea id="sheetText" readonly></textarea>
    <div class="row-actions">
      <button class="btn" id="copyBtn">کپی متن</button>
      <button class="btn ghost" id="markBtn">علامت‌گذاری: منتشر شد</button>
      <button class="btn soft" id="closeSheet">بستن</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="sheet-wrap" id="viewer">
  <div class="sheet">
    <h3 id="viewerTitle">عکس‌ها</h3>
    <div class="viewer" id="viewerBox"></div>
    <div class="row-actions">
      <button class="btn ghost" id="viewerDel">حذف این عکس</button>
      <button class="btn soft" id="closeViewer">بستن</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORE_KEY = "juyandeh-karako-mobile-v1";
  var storageOK = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch(e){ storageOK = false; }

  function fa(v){
    return String(v).replace(/[0-9]/g, function(d){ return "۰۱۲۳۴۵۶۷۸۹"[+d]; });
  }
  function pad(n){ return n < 10 ? "0" + n : String(n); }
  function toJalali(gy, gm, gd){
    var gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
    var jy = (gy <= 1600) ? 0 : 979;
    gy -= (gy <= 1600) ? 621 : 1600;
    var gy2 = (gm > 2) ? (gy + 1) : gy;
    var days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) +
               Math.floor((gy2 + 399) / 400) - 80 + gd + gdm[gm - 1];
    jy += 33 * Math.floor(days / 12053); days %= 12053;
    jy += 4 * Math.floor(days / 1461); days %= 1461;
    jy += Math.floor((days - 1) / 365); if(days > 365) days = (days - 1) % 365;
    var jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
    var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
    return [jy, jm, jd];
  }
  function nowText(){
    var d = new Date();
    var j = toJalali(d.getFullYear(), d.getMonth() + 1, d.getDate());
    return fa(j[0]) + "/" + fa(pad(j[1])) + "/" + fa(pad(j[2]));
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  var MEDIA_DB = "juyandeh-media", MEDIA_ST = "photos";
  var mediaOK = !!window.indexedDB;
  var photoIndex = {};          // fileId -> [{id, thumb, name}]
  var dbPromise = null;
  var viewer = { list:[], i:0, fileId:null };

  function openDb(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      var req;
      try { req = indexedDB.open(MEDIA_DB, 1); } catch(e){ reject(e); return; }
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains(MEDIA_ST)){
          db.createObjectStore(MEDIA_ST, { keyPath:"id" });
        }
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbPromise;
  }
  function store(mode){
    return openDb().then(function(db){ return db.transaction(MEDIA_ST, mode).objectStore(MEDIA_ST); });
  }
  function wrap(req){
    return new Promise(function(res, rej){
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(){ rej(req.error); };
    });
  }
  function putPhoto(p){ return store("readwrite").then(function(s){ return wrap(s.put(p)); }); }
  function dropPhoto(id){ return store("readwrite").then(function(s){ return wrap(s.delete(id)); }); }
  function getPhoto(id){ return store("readonly").then(function(s){ return wrap(s.get(id)); }); }
  function allPhotos(){ return store("readonly").then(function(s){ return wrap(s.getAll()); }); }
  function clearPhotos(){ return store("readwrite").then(function(s){ return wrap(s.clear()); }); }

  function groupPhotos(list){
    photoIndex = {};
    list.sort(function(a,b){ return (a.ts || 0) - (b.ts || 0); });
    list.forEach(function(p){
      if(!photoIndex[p.fileId]) photoIndex[p.fileId] = [];
      photoIndex[p.fileId].push({ id:p.id, thumb:p.thumb, name:p.name });
    });
  }

  function loadMedia(){
    if(!mediaOK) return Promise.resolve();
    return allPhotos().then(function(list){
      var ids = {}, keep = [], orphan = [];
      files.forEach(function(f){ ids[f.id] = 1; });
      list.forEach(function(p){ (ids[p.fileId] ? keep : orphan).push(p); });
      orphan.forEach(function(p){ dropPhoto(p.id).catch(function(){}); });
      groupPhotos(keep);
    }).catch(function(){ photoIndex = {}; });
  }

  function shrinkImage(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth || 1200, h = img.naturalHeight || 900, max = 1280;
        if(Math.max(w, h) > max){
          if(w >= h){ h = Math.round(h * max / w); w = max; }
          else { w = Math.round(w * max / h); h = max; }
        }
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        var data = c.toDataURL("image/jpeg", 0.72);
        var tw = 320, th = Math.round(h * tw / w);
        if(th > 320){ th = 320; tw = Math.round(w * 320 / h); }
        var t = document.createElement("canvas");
        t.width = tw; t.height = th;
        t.getContext("2d").drawImage(img, 0, 0, tw, th);
        URL.revokeObjectURL(url);
        resolve({ data:data, thumb:t.toDataURL("image/jpeg", 0.6), w:w, h:h });
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("image")); };
      img.src = url;
    });
  }

  function formFileId(){ return state.editing ? state.editing.id : state.draftId; }

  function addPhotos(fileList){
    if(!mediaOK){ toast("این مرورگر اجازه ذخیره عکس نمی‌دهد"); return; }
    var id = formFileId();
    var arr = Array.prototype.slice.call(fileList || []).filter(function(f){
      return /^image\//.test(f.type || "");
    });
    if(!arr.length) return;
    if(!photoIndex[id]) photoIndex[id] = [];
    var added = 0;
    arr.reduce(function(chain, f){
      return chain.then(function(){
        return shrinkImage(f).then(function(out){
          var p = {
            id:"p" + Date.now() + Math.random().toString(36).slice(2, 6),
            fileId:id, name:f.name || "عکس", ts:Date.now(),
            w:out.w, h:out.h, thumb:out.thumb, data:out.data
          };
          return putPhoto(p).then(function(){
            photoIndex[id].push({ id:p.id, thumb:p.thumb, name:p.name });
            added++;
            renderPhotoGrid();
          });
        }).catch(function(){});
      });
    }, Promise.resolve()).then(function(){
      render();
      toast(added ? fa(added) + " عکس اضافه شد" : "عکس خوانده نشد");
    });
  }

  function removePhoto(id){
    Object.keys(photoIndex).forEach(function(k){
      photoIndex[k] = photoIndex[k].filter(function(p){ return p.id !== id; });
    });
    if(mediaOK) dropPhoto(id).catch(function(){});
    renderPhotoGrid();
    render();
  }

  function renderPhotoGrid(){
    var grid = document.getElementById("photoGrid");
    var id = formFileId();
    var ps = (id && photoIndex[id]) || [];
    grid.innerHTML = ps.map(function(p){
      return '<div class="photo"><img src="' + p.thumb + '" alt="">' +
        '<button type="button" class="x" data-del="' + p.id + '" aria-label="حذف عکس">×</button></div>';
    }).join("");
  }

  function stripHTML(f){
    var ps = photoIndex[f.id] || [];
    if(!ps.length) return "";
    var shown = ps.slice(0, 4).map(function(p, i){
      return '<button type="button" data-act="photo" data-id="' + f.id + '" data-i="' + i + '">' +
        '<img src="' + p.thumb + '" alt=""></button>';
    }).join("");
    var more = ps.length > 4
      ? '<button type="button" class="more" data-act="photo" data-id="' + f.id + '" data-i="0">' + fa(ps.length) + ' عکس</button>'
      : "";
    return '<div class="strip">' + shown + more + '</div>';
  }

  function dealLabel(f){ return f.deal === "rent" ? "رهن و اجاره" : "فروش"; }
  function priceText(f){
    if(f.deal === "rent"){
      var parts = [];
      if(f.deposit) parts.push("رهن " + f.deposit);
      if(f.rent) parts.push("اجاره " + f.rent);
      return parts.length ? parts.join(" | ") : (f.price || "توافقی");

    return f.price || "توافقی";

    if(s === "منتشر شده") return "ok";

  function render(){
    var q = state.q.trim();
    var items = files.filter(function(f){
      if(state.filter === "sale" && f.deal !== "sale") return false;
      if(state.filter === "rent" && f.deal !== "rent") return false;
      if(state.filter === "published" && f.status !== "منتشر شده") return false;
      if(!q) return true;
      var hay = [f.title, f.district, f.details, f.price, f.deposit, f.rent, f.consultant].join(" ");
      return hay.indexOf(q) !== -1;
    });

    countEl.textContent = fa(files.length) + " فایل ثبت‌شده";

    if(!items.length){
      listEl.innerHTML = '<div class="empty"><b>فایلی پیدا نشد</b>از تب «افزودن» فایل تازه ثبت کن.</div>';
      return;
    }

    listEl.innerHTML = items.map(function(f){
      return '<article class="card">' +
        '<h3>' + esc(f.title) + '</h3>' +
        '<div class="meta">' +
          '<i>' + dealLabel(f) + '</i>' +
          (f.district ? '<i>' + esc(f.district) + '</i>' : '') +
          (f.area ? '<i>' + esc(f.area) + ' متر</i>' : '') +
          (f.rooms ? '<i>' + esc(f.rooms) + ' اتاق</i>' : '') +
        '</div>' +
        '<div class="price">' + esc(priceText(f)) + '</div>' +
        '<div class="status" style="margin-bottom:10px"><span class="dot ' + statusDot(f.status) + '"></span>' + esc(f.status || "در انتظار") + ' <small>' + esc(f.createdAt || "") + '</small></div>' +
        stripHTML(f) +
        '<div class="card-actions">' +
          '<button class="btn" data-act="divar" data-id="' + f.id + '">متن دیوار</button>' +
          '<button class="btn ghost" data-act="sheypoor" data-id="' + f.id + '">متن شیپور</button>' +
          '<button class="btn soft" data-act="edit" data-id="' + f.id + '">ویرایش</button>' +
          '<button class="btn soft" data-act="del" data-id="' + f.id + '">حذف</button>' +
        '</div>' +
      '</article>';
    }).join("");

  function adText(f, kind){
    var lines = [];
    lines.push(f.title || "فایل جدید");
    if(f.district) lines.push("محله: " + f.district);
    var spec = [];
    if(f.area) spec.push(f.area + " متر");
    if(f.rooms) spec.push(f.rooms + " خوابه");
    if(spec.length) lines.push(spec.join(" • "));
    if(f.deal === "rent"){
      if(f.deposit) lines.push("رهن: " + f.deposit);
      if(f.rent) lines.push("اجاره: " + f.rent);
    } else if(f.price){
      lines.push("قیمت: " + f.price);
    }
    if(f.details) lines.push(f.details);
    if(kind === "sheypoor"){
      lines.push("");
      lines.push("#محمودآباد #فایل_مسکن #جوینده_کاراکو");
    } else {
      lines.push("");
      lines.push("برای هماهنگی بازدید پیام بدهید.");
    }
    if(f.link && kind === "divar") lines.push(f.link);
    return lines.join("\n");
  }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove("on"); }, 1900);
  }

  function copyText(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("کپی شد"); }, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.getElementById("sheetText");
      ta.removeAttribute("readonly");
      ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
      ta.setAttribute("readonly","readonly");
      toast(ok ? "کپی شد" : "دستی انتخاب و کپی کن");
    }
  }

    var f = files.filter(function(x){ return x.id === id; })[0];

    state.sheetId = id;

    document.getElementById("sheetTitle").textContent = kind === "sheypoor" ? "متن آماده شیپور" : "متن آماده دیوار";

  function switchTab(tab){
    state.tab = tab;
    Array.prototype.forEach.call(document.querySelectorAll(".page"), function(p){
      p.classList.remove("on");
    });
    document.getElementById("page-" + tab).classList.add("on");
    Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function(b){
      b.classList.toggle("on", b.dataset.tab === tab);
    });
    if(tab !== "add") resetForm();
    if(tab === "team") paintAccount();
    window.scrollTo(0,0);
  }

    state.draftId = "f" + Date.now() + Math.random().toString(36).slice(2, 5);

  function resetForm(){
    state.editing = null;
    var f = document.getElementById("fileForm");
    f.reset();
    document.getElementById("fid").value = "";
    document.getElementById("saveBtn").textContent = "ثبت فایل";
    document.getElementById("cancelEdit").style.display = "none";
    Array.prototype.forEach.call(document.querySelectorAll("#dealSeg button"), function(b){
      b.classList.toggle("on", b.dataset.deal === "sale");
    });

    renderPhotoGrid();

    if(!f) return;
    state.editing = f;
    switchTab("add");
    document.getElementById("fid").value = f.id;

    document.getElementById("district").value = f.district || "";
    document.getElementById("area").value = f.area || "";
    document.getElementById("rooms").value = f.rooms || "";
    document.getElementById("price").value = (f.deal === "sale" ? (f.price || "") : "");
    document.getElementById("deposit").value = f.deposit || "";
    document.getElementById("rent").value = f.rent || "";
    document.getElementById("details").value = f.details || "";
    document.getElementById("link").value = f.link || "";
    document.getElementById("owner").value = f.owner || "";
    document.getElementById("consultant").value = f.consultant || "";

    if(!b) return;
    var id = b.dataset.id, act = b.dataset.act;
    if(act === "divar" || act === "sheypoor"){ openSheet(id, act); return; }
    if(act === "photo"){ openViewer(id, +b.dataset.i || 0); return; }
    if(act === "edit"){ startEdit(id); return; }
    if(act === "del"){
      if(!confirm("این فایل حذف شود؟ عکس‌هایش هم پاک می‌شوند.")) return;
      (photoIndex[id] || []).forEach(function(p){
        if(mediaOK) dropPhoto(p.id).catch(function(){});
      });
      delete photoIndex[id];
      files = files.filter(function(x){ return x.id !== id; });
      save(); render(); toast("حذف شد");
    }
  });

  function autoSendToOffice(f){
    if(!account) return;
    if(f.officeSent) return;
    fetch("inbox.json?t=" + Date.now(), { cache:"no-store" })
      .then(function(r){ if(!r.ok) throw new Error("cfg"); return r.json(); })
      .then(function(cfg){
        if(!cfg || !cfg.token) throw new Error("nocfg");
        var payload = {
          t:"jk", v:1,
          code: reqCode(account.phone),
          h: phoneHash(account.phone),
          name: account.name || "",
          file: f
        };
        return fetch("https://api.github.com/repos/mehdiabbasi9821-afk/juyandeh-inbox/issues", {
          method:"POST",
          headers:{
            "Authorization":"Bearer " + cfg.token,
            "Accept":"application/vnd.github+json",
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            title: payload.code + " | " + String(f.title || "فایل").slice(0, 50),
            body: "JKF1 " + JSON.stringify(payload)
          })
        });
      })
      .then(function(r){
        if(!r.ok) throw new Error("send");
        f.officeSent = nowText();
        save();
        toast("به دفتر هم فرستاده شد");
      })
      .catch(function(e){
        toast((e.message === "cfg" || e.message === "nocfg") ? "ذخیره شد؛ دفتر هنوز پل را فعال نکرده" : "ذخیره شد ولی به دفتر نرسید؛ اینترنت را چک کن");
      });
  }

      x.classList.toggle("on", x === b);

  document.getElementById("fileForm").addEventListener("submit", function(e){
    e.preventDefault();
    var deal = document.querySelector("#dealSeg button.on").dataset.deal;
    var title = document.getElementById("title").value.trim();
    if(!title){ toast("عنوان لازم است"); return; }
    var obj = state.editing ? state.editing : { id: state.draftId, status:"متن آماده", createdAt: nowText() };
    obj.deal = deal;
    obj.title = title;
    obj.district = document.getElementById("district").value.trim();
    obj.area = document.getElementById("area").value.trim();
    obj.rooms = document.getElementById("rooms").value.trim();
    if(deal === "sale"){
      obj.price = document.getElementById("price").value.trim();
      obj.deposit = ""; obj.rent = "";
    }else{
      obj.deposit = document.getElementById("deposit").value.trim();
      obj.rent = document.getElementById("rent").value.trim();
      var parts = [];
      if(obj.deposit) parts.push("رهن " + obj.deposit);
      if(obj.rent) parts.push("اجاره " + obj.rent);
      obj.price = parts.join(" | ");
    }
    obj.details = document.getElementById("details").value.trim();
    obj.link = document.getElementById("link").value.trim();
    obj.owner = document.getElementById("owner").value.trim();
    obj.consultant = document.getElementById("consultant").value.trim();
    obj.updatedAt = nowText();

    if(state.editing){
      var i = files.indexOf(state.editing);
      if(i > -1) files[i] = obj;
    }else{
      files.unshift(obj);
      newDraftId();
      autoSendToOffice(obj);
    }
    save();
    resetForm();
    switchTab("list");
    render();
    toast("ذخیره شد");
  });

  document.getElementById("cancelEdit").addEventListener("click", function(){
    resetForm(); switchTab("list");
  });

  document.getElementById("addCam").addEventListener("click", function(){
    document.getElementById("camInput").click();
  });
  document.getElementById("addGal").addEventListener("click", function(){
    document.getElementById("galInput").click();
  });
  document.getElementById("camInput").addEventListener("change", function(){
    addPhotos(this.files);
    this.value = "";
  });
  document.getElementById("galInput").addEventListener("change", function(){
    addPhotos(this.files);
    this.value = "";
  });
  document.getElementById("photoGrid").addEventListener("click", function(e){
    var b = e.target.closest("button[data-del]");
    if(!b) return;
    if(!confirm("این عکس حذف شود؟")) return;
    removePhoto(b.dataset.del);
  });

  document.getElementById("closeViewer").addEventListener("click", closeViewer);
  document.getElementById("viewer").addEventListener("click", function(e){
    if(e.target === this) closeViewer();
  });
  document.getElementById("viewerBox").addEventListener("click", function(e){
    var b = e.target.closest("button[data-v]");
    if(!b || b.disabled) return;
    viewer.i += (b.dataset.v === "next" ? 1 : -1);
    if(viewer.i < 0) viewer.i = 0;
    if(viewer.i > viewer.list.length - 1) viewer.i = viewer.list.length - 1;
    paintViewer();
  });
  document.getElementById("viewerDel").addEventListener("click", function(){
    var p = viewer.list[viewer.i];
    if(!p) return;
    if(!confirm("این عکس حذف شود؟")) return;
    removePhoto(p.id);
    viewer.list = viewer.list.filter(function(x){ return x.id !== p.id; });
    if(!viewer.list.length){ closeViewer(); toast("حذف شد"); return; }
    if(viewer.i > viewer.list.length - 1) viewer.i = viewer.list.length - 1;
    paintViewer();
    toast("حذف شد");
  });

  document.getElementById("closeSheet").addEventListener("click", closeSheet);
  document.getElementById("sheet").addEventListener("click", function(e){
    if(e.target === this) closeSheet();
  });
  document.getElementById("copyBtn").addEventListener("click", function(){
    copyText(document.getElementById("sheetText").value);
  });
  document.getElementById("markBtn").addEventListener("click", function(){
    var f = files.filter(function(x){ return x.id === state.sheetId; })[0];
    if(!f) return;
    f.status = f.status === "منتشر شده" ? "متن آماده" : "منتشر شده";
    save();
    document.getElementById("markBtn").textContent = f.status === "منتشر شده" ? "برگرداندن به متن آماده" : "علامت‌گذاری: منتشر شد";
    render();
    toast(f.status);
  });

  document.getElementById("backupBtn").addEventListener("click", function(){
    var photosP = mediaOK ? allPhotos().catch(function(){ return []; }) : Promise.resolve([]);
    photosP.then(function(photos){
      var payload = { savedAt: nowText(), app:"juyandeh-karako", files: files, photos: photos || [] };
      var data = JSON.stringify(payload);
      var note = "پشتیبان ذخیره شد";
      if(data.length > 22 * 1024 * 1024){
        payload.photos = [];
        data = JSON.stringify(payload, null, 2);
        note = "عکس‌ها جا نشد؛ فقط فایل‌ها ذخیره شد";
      }
      var blob = new Blob([data], { type: "application/json;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "juyandeh-backup-" + nowText().replace(/\//g, "-") + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      toast(note);
    });
  });

  document.getElementById("restoreBtn").addEventListener("click", function(){
    document.getElementById("restoreInput").click();
  });

  document.getElementById("restoreInput").addEventListener("change", function(){
    var input = this;
    var file = input.files && input.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(String(reader.result));
        var arr = Array.isArray(parsed) ? parsed : (parsed && parsed.files);
        if(!Array.isArray(arr)) throw new Error("bad");
        if(!confirm("جای فایل‌های فعلی با پشتیبان عوض شود؟ (" + arr.length + " فایل)")){ input.value = ""; return; }
        files = arr.map(function(f){
          f.id = f.id || ("f" + Math.random().toString(36).slice(2));
          f.status = f.status || "در انتظار";
          return f;
        });
        var photos = (parsed && Array.isArray(parsed.photos)) ? parsed.photos : [];
        save();
        var done = mediaOK && photos.length
          ? clearPhotos().then(function(){
              return photos.reduce(function(chain, p){
                return chain.then(function(){ return putPhoto(p).catch(function(){}); });
              }, Promise.resolve());
            }).then(function(){ return allPhotos(); }).then(groupPhotos)
          : Promise.resolve().then(function(){ photoIndex = {}; });
        done.catch(function(){}).then(function(){
          render(); renderPhotoGrid(); resetForm();
          toast("بازیابی شد");
        });
        input.value = "";
      }catch(e){ toast("فایل پشتیبان خوانده نشد"); input.value = ""; }
    };
    reader.readAsText(file);
  });

  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function(b){
    b.addEventListener("click", function(){ switchTab(b.dataset.tab); });
  });

  /* ------------- حساب و دسترسی ------------- */
  var ACC_KEY = "juyandeh-account-v1";
  var account = null;
  var access = { status:"none", at:"", since:"" };

  function normPhone(v){
    var s = String(v == null ? "" : v);
    s = s.replace(/[۰-۹]/g, function(d){ return String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)); });
    s = s.replace(/[٠-٩]/g, function(d){ return String("٠١٢٣٤٥٦٧٨٩".indexOf(d)); });
    s = s.replace(/\D/g, "");
    if(s.indexOf("0098") === 0) s = s.slice(4);
    else if(s.indexOf("98") === 0 && s.length > 10) s = s.slice(2);
    if(s.length === 10 && s.charAt(0) === "9") s = "0" + s;
    return s;
  }
  function phoneHash(ph){
    var s = "jk:" + normPhone(ph), h = 0x811c9dc5;
    for(var i = 0; i < s.length; i++){
      h ^= s.charCodeAt(i);
      h = (h + (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24)) >>> 0;
    }
    return ("0000000" + h.toString(16)).slice(-8);
  }
  function reqCode(ph){
    var h = phoneHash(ph).toUpperCase();
    return "K-" + h.slice(0, 4) + "-" + h.slice(4);
  }
  function phoneText(ph){
    var s = normPhone(ph);
    if(s.length !== 11) return s;
    return fa(s.slice(0, 4) + " " + s.slice(4, 7) + " " + s.slice(7));
  }

  function loadAccount(){
    account = null;
    try{
      var raw = localStorage.getItem(ACC_KEY);
      if(raw) account = JSON.parse(raw);
    }catch(e){ account = null; }
    if(account && !account.phone) account = null;
  }
  function saveAccount(){
    try{
      if(account) localStorage.setItem(ACC_KEY, JSON.stringify(account));
      else localStorage.removeItem(ACC_KEY);
    }catch(e){}
  }

  function copyPlain(txt, okMsg){
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = txt;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
      document.body.removeChild(ta);
      toast(ok ? (okMsg || "کپی شد") : "کپی نشد؛ دستی انتخاب کن");
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast(okMsg || "کپی شد"); }, fallback);
    } else fallback();
  }

  function accessRow(){
    if(access.status === "ok") return '<span class="status"><span class="dot ok"></span>دسترسی تأیید شده</span>';
    if(access.status === "pending") return '<span class="status"><span class="dot wait"></span>در انتظار تأیید دفتر</span>';
    if(access.status === "checking") return '<span class="status"><span class="dot wait"></span>در حال بررسی…</span>';
    if(access.status === "offline") return '<span class="status"><span class="dot"></span>وضعیت خوانده نشد</span>';
    return '<span class="status"><span class="dot"></span>بررسی نشده</span>';
  }

  function requestText(){
    return "درخواست دسترسی جوینده کاراکو\n" +
      "نام: " + (account.name || "") + "\n" +
      "شماره: " + normPhone(account.phone) + "\n" +
      "کد درخواست: " + reqCode(account.phone);
  }

  function paintAccount(){
    var box = document.getElementById("accountBox");
    if(!account){
      box.innerHTML =
        '<div class="card">' +
          '<h3 style="margin-top:0">ورود با شماره موبایل</h3>' +
          '<p class="hint" style="margin-top:0">شماره‌ات را ثبت کن تا دفتر بتواند برایت دسترسی بدهد.</p>' +
          '<form id="accForm" autocomplete="on">' +
            '<div class="field"><label for="accName">نام و نام خانوادگی</label>' +
              '<input id="accName" required placeholder="مثلا رضا احمدی"></div>' +
            '<div class="field"><label for="accPhone">شماره موبایل</label>' +
              '<input id="accPhone" required inputmode="tel" autocomplete="tel" placeholder="۰۹۱۲۳۴۵۶۷۸۹"></div>' +
            '<button class="save" type="submit">ثبت شماره</button>' +
          '</form>' +
          '<div class="note" style="margin-top:12px;margin-bottom:0">' +
            'شماره فقط روی همین گوشی می‌ماند. تأیید دسترسی را برنامه دفتر انجام می‌دهد.' +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<h3 style="margin-top:0">بعد از ورود چه می‌شود</h3>' +
          '<div class="kv"><span>ثبت فایل و عکس</span><b>همین حالا</b></div>' +
          '<div class="kv"><span>متن آماده دیوار و شیپور</span><b>همین حالا</b></div>' +
          '<div class="kv"><span>دیدن فایل همکاران</span><b>با تأیید دفتر</b></div>' +
          '<div class="kv"><span>فرستادن فایل و عکس به دفتر</span><b>با تأیید دفتر</b></div>' +
        '</div>';
      return;
    }
    var ok = access.status === "ok";
    box.innerHTML =
      '<div class="card">' +
        '<h3 style="margin-top:0">حساب من</h3>' +
        '<div class="kv"><span>نام</span><b>' + esc(account.name || "—") + '</b></div>' +
        '<div class="kv"><span>شماره</span><b>' + phoneText(account.phone) + '</b></div>' +
        '<div class="kv"><span>وضعیت</span>' + accessRow() + '</div>' +
        '<div class="code">' + reqCode(account.phone) + '</div>' +
        '<div class="row-actions">' +
          '<button class="btn" type="button" data-acc="check">به‌روزرسانی وضعیت</button>' +
          '<button class="btn ghost" type="button" data-acc="send">کپی درخواست برای دفتر</button>' +
          '<button class="btn soft" type="button" data-acc="out">خروج از حساب</button>' +
        '</div>' +
        '<p class="hint">این کد را برای دفتر بفرست. دفتر بعد از ثبت شماره‌ات، دسترسی را باز می‌کند.</p>' +
      '</div>' +
      '<div class="card">' +
        '<h3 style="margin-top:0">امکانات حساب</h3>' +
        '<div class="kv"><span>ثبت فایل، عکس و متن آگهی</span><b>فعال</b></div>' +
        '<div class="kv"><span>دیدن فایل همکاران</span><b>' + (ok ? "فعال" : "پس از تأیید") + '</b></div>' +
        '<div class="kv"><span>فرستادن فایل و عکس به دفتر</span><b>' + (ok ? "فعال" : "پس از تأیید") + '</b></div>' +
        '<p class="hint" style="margin-bottom:0">' + (access.at ? "آخرین بررسی: " + access.at : "وضعیت هنوز بررسی نشده.") + '</p>' +
      '</div>';
  }

  function checkAccess(report){
    if(!account){ access = { status:"none", at:"", since:"" }; paintAccount(); return; }
    var mine = phoneHash(account.phone);
    access = { status:"checking", at:nowText(), since:"" };
    paintAccount();
    fetch("access.json?t=" + Date.now(), { cache:"no-store" })
      .then(function(r){
        if(!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(function(j){
        var list = (j && j.approved) || [];
        var me = null;
        for(var i = 0; i < list.length; i++){
          var h = String((list[i] && (list[i].h || list[i].phone)) || "").toLowerCase();
          if(h === mine) me = list[i];
        }
        access = { status: me ? "ok" : "pending", at:nowText(), since:(me && me.since) || "" };
        paintAccount();
        if(report) toast(me ? "دسترسی فعال است" : "هنوز تأیید نشده");
      })
      .catch(function(){
        access = { status:"offline", at:nowText(), since:"" };
        paintAccount();
        if(report) toast("وضعیت خوانده نشد");
      });
  }

  document.getElementById("accountBox").addEventListener("submit", function(e){
    var f = e.target;
    if(!f || f.id !== "accForm") return;
    e.preventDefault();
    var nm = document.getElementById("accName").value.trim();
    var ph = normPhone(document.getElementById("accPhone").value);
    if(!nm){ toast("نام را بنویس"); return; }
    if(!/^09\d{9}$/.test(ph)){ toast("شماره موبایل درست نیست"); return; }
    account = { name:nm, phone:ph, since:nowText() };
    saveAccount();
    access = { status:"none", at:"", since:"" };
    paintAccount();
    toast("شماره ثبت شد");
    checkAccess(true);
  });

  document.getElementById("accountBox").addEventListener("click", function(e){
    var b = e.target.closest("button[data-acc]");
    if(!b || !account) return;
    if(b.dataset.acc === "check"){ checkAccess(true); return; }
    if(b.dataset.acc === "send"){ copyPlain(requestText(), "متن درخواست کپی شد"); return; }
    if(b.dataset.acc === "out"){
      if(!confirm("از حساب خارج شوی؟ فایل‌ها و عکس‌ها پاک نمی‌شوند.")) return;
      account = null;
      saveAccount();
      access = { status:"none", at:"", since:"" };
      paintAccount();
      toast("خارج شدی");
    }
  });

  if(!storageOK) document.getElementById("offlineNote").style.display = "block";
  loadAccount();
  load(); seed();
  newDraftId();
  render(); syncDeal(); paintAccount();
  loadMedia().then(function(){ renderPhotoGrid(); render(); });
  if(account) checkAccess(false);
})();
</script>
